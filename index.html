<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ammasso stellare 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #010206; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  #hint { position: fixed; left: 12px; bottom: 10px; color: #8892b0;
          font: 12px sans-serif; pointer-events: none; transition: opacity .5s; }

  /* ---------- Tooltip hover ---------- */
  #tip { position: fixed; z-index: 10; pointer-events: none; max-width: 240px;
         padding: 10px 12px; border-radius: 10px; color: #dfe6ff;
         background: rgba(10, 14, 30, .82); border: 1px solid rgba(140, 160, 255, .25);
         backdrop-filter: blur(6px); font: 13px/1.4 system-ui, sans-serif;
         opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; }
  #tip.show { opacity: 1; transform: translateY(0); }
  #tip .name { font-weight: 600; margin-bottom: 2px; }
  #tip .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
              margin-right: 7px; box-shadow: 0 0 8px currentColor; }
  #tip .meta { color: #98a4d0; font-size: 12px; margin-bottom: 6px; }
  #tip .txt { color: #c4cdf0; font-size: 12.5px; }

  /* ---------- Pagina di libro ---------- */
  #book { position: fixed; z-index: 20; top: 50%; right: 4vw;
          width: min(520px, 44vw); max-height: 82vh; box-sizing: border-box;
          padding: 38px 44px 22px 52px; color: #2b2118;
          font-family: Georgia, 'Times New Roman', serif;
          background: linear-gradient(90deg, #e6dcc2 0, #f4ecd8 28px, #f7f0de 100%);
          border-radius: 4px 10px 10px 4px;
          box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 14px 0 18px -14px rgba(0,0,0,.45);
          opacity: 0; pointer-events: none;
          transform: translateY(-50%) translateX(50px);
          transition: opacity .8s ease, transform .8s ease; }
  #book.open { opacity: 1; pointer-events: auto; transform: translateY(-50%) translateX(0); }
  #book .close { position: absolute; top: 12px; right: 16px; border: 0; background: none;
                 font-size: 20px; cursor: pointer; color: #6b5a44; }
  #book .close:hover { color: #000; }
  #book h1 { margin: 0; font-size: 30px; letter-spacing: .5px; }
  #book .sub { margin: 4px 0 14px; font-style: italic; color: #6b5a44; font-size: 14px; }
  #book hr { border: 0; border-top: 1px solid rgba(80, 60, 30, .3); margin: 0 0 14px; }
  #book .content { overflow-y: auto; max-height: calc(82vh - 190px); padding-right: 6px; }
  #book .content p { margin: 0 0 12px; line-height: 1.7; font-size: 16.5px;
                     text-align: justify; hyphens: auto; }
  #book .content p:first-of-type::first-letter {
    float: left; font-size: 3.4em; line-height: .8; padding: 6px 8px 0 0;
    color: var(--accent, #8a5a1a); font-weight: bold; }
  #book .content.turn { animation: turn .45s ease; }
  @keyframes turn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
  #book .nav { display: flex; align-items: center; justify-content: space-between;
               margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(80,60,30,.3);
               font-size: 14px; color: #6b5a44; }
  #book .nav button { border: 1px solid rgba(80,60,30,.4); background: transparent;
                      border-radius: 6px; padding: 4px 12px; font-size: 18px; cursor: pointer;
                      color: #4a3a28; }
  #book .nav button:hover:not(:disabled) { background: rgba(80,60,30,.12); }
  #book .nav button:disabled { opacity: .3; cursor: default; }

  @media (max-width: 800px) {
    #book { top: auto; bottom: 3vh; left: 3vw; right: 3vw; width: auto; max-height: 52vh;
            padding: 26px 24px 16px 30px; transform: translateY(50px); }
    #book.open { transform: translateY(0); }
    #book .content { max-height: calc(52vh - 160px); }
    #book h1 { font-size: 24px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hint">Trascina: ruota · Rotella/pinch: zoom · Tasto destro: pan · Passa sopra una stella per le info · Click per aprirla</div>
<div id="tip"></div>
<div id="book">
  <button class="close" id="bClose" aria-label="Chiudi">✕</button>
  <h1 id="bTitle"></h1>
  <div class="sub" id="bSub"></div>
  <hr>
  <div class="content" id="bContent"></div>
  <div class="nav">
    <button id="bPrev" aria-label="Pagina precedente">‹</button>
    <span id="bNum"></span>
    <button id="bNext" aria-label="Pagina successiva">›</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =========================================================
   INFO DELLE STELLE  (qui inserisci i tuoi contenuti)
   Chiave = nome stella ("Stella Demo 1", "Stella Demo 2", ...)
   ========================================================= */
const STAR_INFO = {
  // "Stella Demo 1": {
  //   title: "Il mio titolo",
  //   subtitle: "Un sottotitolo",
  //   tooltip: "Testo breve per l'hover",
  //   pages: ["<p>Prima pagina…</p>", "<p>Seconda pagina…</p>"]
  // }
};
const DEMO_PAGES = [
  `<p>Questo è un testo dimostrativo. Qui potrai raccontare la storia di questa stella: da dove nasce, di che cosa è fatta e perché si trova proprio in questo punto dell'ammasso.</p>
   <p>Ogni pagina può contenere più paragrafi, elenchi, citazioni o immagini. Il contenuto viene letto come HTML, quindi hai piena libertà di formattazione.</p>`,
  `<p>Seconda pagina di esempio. Puoi usarla per approfondire un aspetto particolare, ad esempio la composizione chimica, il ciclo di vita oppure un episodio legato al tuo progetto.</p>
   <p>Le frecce in basso, oppure i tasti sinistra e destra della tastiera, servono a sfogliare le pagine.</p>`,
  `<p>Terza e ultima pagina. Quando il contenuto è più lungo dello spazio disponibile, la pagina scorre in verticale, senza uscire dal riquadro.</p>
   <p>Per chiudere la scheda e tornare alla vista dell'universo premi la X in alto oppure il tasto Esc.</p>`
];
function getInfo(s) {
  const custom = STAR_INFO[s.name] || {};
  return {
    title: custom.title || s.name,
    subtitle: custom.subtitle || `Classe spettrale ${s.cls} · ${Math.round(s.temp).toLocaleString('it-IT')} K`,
    tooltip: custom.tooltip || 'Testo demo: qui compariranno le informazioni principali. Clicca per aprire la scheda.',
    pages: custom.pages || DEMO_PAGES
  };
}

// ---------- Random con seed ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(7);

// ---------- Renderer, camera, controlli ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const el = renderer.domElement;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010206);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 30000);
camera.position.set(0, 600, 1600);

const controls = new OrbitControls(camera, el);
controls.enableDamping = true;
controls.minDistance = 60;
controls.maxDistance = 6000;

// ---------- Bloom ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.9, 0.7, 0.75));
composer.addPass(new OutputPass());

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// ---------- Temperatura (K) -> colore ----------
function kelvinToColor(K) {
  const t = K / 100;
  const r = t <= 66 ? 255 : 329.698727446 * Math.pow(t - 60, -0.1332047592);
  const g = t <= 66 ? 99.4708025861 * Math.log(t) - 161.1195681661
                    : 288.1221695283 * Math.pow(t - 60, -0.0755148492);
  const b = t >= 66 ? 255 : (t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307);
  const c = x => Math.max(0, Math.min(255, x)) / 255;
  return new THREE.Color().setRGB(c(r), c(g), c(b), THREE.SRGBColorSpace);
}

// [peso, temperatura, fattore dimensione, classe]
const TYPES = [
  [35, 3200, 0.9, 'M'], [25, 4400, 1.0, 'K'], [15, 5700, 1.1, 'G'],
  [10, 6800, 1.2, 'F'], [8, 9000, 1.3, 'A'], [5, 15000, 1.5, 'B'], [2, 28000, 1.7, 'O']
];
const totalW = TYPES.reduce((s, t) => s + t[0], 0);
function pickType() {
  let r = rnd() * totalW;
  for (const t of TYPES) { if ((r -= t[0]) <= 0) return t; }
  return TYPES[0];
}

// ---------- Alone ----------
function makeGlowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grad.addColorStop(0, 'rgba(255,255,255,0.9)');
  grad.addColorStop(0.2, 'rgba(255,255,255,0.35)');
  grad.addColorStop(0.5, 'rgba(255,255,255,0.08)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
const glowTex = makeGlowTexture();

// ---------- Shader sfera ----------
const vert = `
varying vec3 vN;
void main() {
  vN = normalize(normalMatrix * normal);
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;
const frag = `
uniform vec3 uColor;
uniform float uInt;
varying vec3 vN;
void main() {
  float f = pow(clamp(vN.z, 0.0, 1.0), 0.6);
  vec3 c = uColor * (0.45 + 0.85 * f) * uInt;
  c += vec3(0.25) * pow(f, 4.0);
  gl_FragColor = vec4(c, 1.0);
}`;
const sphereGeo = new THREE.SphereGeometry(1, 64, 48);

function makeStar(color, radius, intensity, glowScale) {
  const group = new THREE.Group();
  const mesh = new THREE.Mesh(sphereGeo, new THREE.ShaderMaterial({
    uniforms: { uColor: { value: color }, uInt: { value: intensity } },
    vertexShader: vert, fragmentShader: frag
  }));
  mesh.scale.setScalar(radius);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color, blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false, opacity: 0.7
  }));
  glow.scale.setScalar(radius * glowScale);
  group.add(mesh, glow);
  scene.add(group);
  return { group, glow };
}

// ---------- Stella centrale ----------
makeStar(kelvinToColor(6200), 70, 1.3, 9);

// ---------- Stelle orbitanti ----------
const MIN_R = 160;
const wOf = R => 0.1 * (250 / R);
const stars = [];

for (let i = 0; i < 45; i++) {
  const [, T, sizeF, cls] = pickType();
  const temp = T * (0.9 + rnd() * 0.2);
  let radius = (12 + rnd() * 22) * sizeF;
  if (T < 4000 && rnd() < 0.15) radius *= 2;

  const R = MIN_R + Math.pow(rnd(), 0.8) * 760;
  const ang = rnd() * Math.PI * 2;
  const p0 = new THREE.Vector3(Math.cos(ang) * R, (rnd() - 0.5) * R * 0.3, Math.sin(ang) * R).setLength(R);
  const axis = new THREE.Vector3((rnd() - 0.5) * 0.9, 1, (rnd() - 0.5) * 0.9).normalize();

  const color = kelvinToColor(temp);
  const { group, glow } = makeStar(color, radius, 0.9, 7);
  stars.push({
    name: `Stella Demo ${i + 1}`, cls, temp, color,
    css: '#' + color.getHexString(),
    group, glow, radius, p0, axis, w: wOf(R), glowTarget: 0.7
  });
}

// ---------- Polvere di stelle ----------
{
  const N = 3500, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const d = new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).normalize()
      .multiplyScalar(5000 + rnd() * 9000);
    pos.set([d.x, d.y, d.z], i * 3);
    const b = 0.25 + rnd() * 0.6;
    col.set([b * 0.85, b * 0.9, b], i * 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 1.5, sizeAttenuation: false, vertexColors: true })));
}

// ---------- Tempo simulato (si può fermare) ----------
let simT = 0, timeScale = 1, timeScaleTarget = 1;
let lastNow = performance.now();

// ---------- UI: tooltip ----------
const tip = document.getElementById('tip');
const hint = document.getElementById('hint');
let hovered = null, mouseClient = { x: 0, y: 0 };

function showTip(s) {
  const info = getInfo(s);
  tip.innerHTML = `<div class="name"><span class="dot" style="color:${s.css};background:${s.css}"></span>${info.title}</div>
    <div class="meta">${info.subtitle}</div><div class="txt">${info.tooltip}</div>`;
  tip.classList.add('show');
  moveTip();
}
function moveTip() {
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(mouseClient.x + 18, innerWidth - w - 8) + 'px';
  tip.style.top = Math.min(mouseClient.y + 18, innerHeight - h - 8) + 'px';
}
function hideTip() { tip.classList.remove('show'); }
function setHovered(s) {
  if (s === hovered) return;
  if (hovered) hovered.glowTarget = 0.7;
  hovered = s;
  if (s) { s.glowTarget = 1.0; showTip(s); } else hideTip();
}

// ---------- UI: libro ----------
const book = document.getElementById('book');
const bTitle = document.getElementById('bTitle'), bSub = document.getElementById('bSub');
const bContent = document.getElementById('bContent'), bNum = document.getElementById('bNum');
const bPrev = document.getElementById('bPrev'), bNext = document.getElementById('bNext');
let pages = [], pageIdx = 0;

function renderPage(animate = true) {
  bContent.innerHTML = pages[pageIdx];
  bContent.scrollTop = 0;
  bNum.textContent = `${pageIdx + 1} / ${pages.length}`;
  bPrev.disabled = pageIdx === 0;
  bNext.disabled = pageIdx === pages.length - 1;
  if (animate) {
    bContent.classList.remove('turn'); void bContent.offsetWidth; bContent.classList.add('turn');
  }
}
function openBook(s) {
  const info = getInfo(s);
  bTitle.textContent = info.title;
  bSub.textContent = info.subtitle;
  book.style.setProperty('--accent', s.css);
  pages = info.pages; pageIdx = 0;
  renderPage(false);
  book.classList.add('open');
}
function closeBook() { book.classList.remove('open'); }
bPrev.onclick = () => { if (pageIdx > 0) { pageIdx--; renderPage(); } };
bNext.onclick = () => { if (pageIdx < pages.length - 1) { pageIdx++; renderPage(); } };
document.getElementById('bClose').onclick = () => startReturn();

// ---------- Animazione camera ----------
const ease = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
let mode = 'idle';           // idle | in | focus | out
let anim = null, focusStar = null, saved = null;
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();

function startFocus(s) {
  mode = 'in'; focusStar = s;
  controls.enabled = false;
  setHovered(null); hideTip();
  hint.style.opacity = 0;
  saved = { pos: camera.position.clone(), target: controls.target.clone() };

  const sp = s.group.position.clone();
  const dirToCam = saved.pos.clone().sub(sp).normalize();
  const d = s.radius * 2.6;
  const viewDir = sp.clone().sub(saved.pos).normalize();
  const right = new THREE.Vector3().crossVectors(viewDir, new THREE.Vector3(0, 1, 0)).normalize();
  const up = new THREE.Vector3().crossVectors(right, viewDir).normalize();
  const shift = innerWidth > 800 ? right.multiplyScalar(d * 0.34) : up.multiplyScalar(-d * 0.3);

  anim = {
    t0: performance.now(), dur: 2200,
    fromPos: camera.position.clone(), fromTarget: controls.target.clone(),
    dirToCam, d, shift
  };
  timeScaleTarget = 0;
}
function startReturn() {
  if (mode !== 'focus' && mode !== 'in') return;
  closeBook();
  mode = 'out';
  anim = {
    t0: performance.now(), dur: 1800,
    fromPos: camera.position.clone(), fromTarget: controls.target.clone(),
    toPos: saved.pos.clone(), toTarget: saved.target.clone()
  };
  timeScaleTarget = 1;
  focusStar.glowTarget = 0.7;
}
function updateCameraAnim(now) {
  if (mode === 'idle') return false;
  const k = ease(Math.min(1, (now - anim.t0) / anim.dur));
  let toPos, toTarget;

  if (mode === 'in' || mode === 'focus') {
    const sp = focusStar.group.position;
    toTarget = tmpA.copy(sp).add(anim.shift);
    toPos = tmpB.copy(sp).addScaledVector(anim.dirToCam, anim.d).add(anim.shift);
    focusStar.glowTarget = 0.3;
  } else {
    toPos = anim.toPos; toTarget = anim.toTarget;
  }
  camera.position.lerpVectors(anim.fromPos, toPos, k);
  controls.target.lerpVectors(anim.fromTarget, toTarget, k);
  camera.lookAt(controls.target);

  if (k >= 1) {
    if (mode === 'in') { mode = 'focus'; openBook(focusStar); }
    else if (mode === 'out') {
      mode = 'idle';
      camera.position.copy(saved.pos);
      controls.target.copy(saved.target);
      controls.update();
      controls.enabled = true;
      hint.style.opacity = 1;
      focusStar = null;
    }
  }
  return true;
}

addEventListener('keydown', e => {
  if (e.key === 'Escape') startReturn();
  if (mode === 'focus') {
    if (e.key === 'ArrowRight') bNext.click();
    if (e.key === 'ArrowLeft') bPrev.click();
  }
});

// ---------- Selezione / trascinamento / click ----------
const mouse = new THREE.Vector2();
const raycaster = new THREE.Raycaster();
const plane = new THREE.Plane();
const hitP = new THREE.Vector3(), tmpV = new THREE.Vector3();
const dragOffset = new THREE.Vector3(), dragPos = new THREE.Vector3();
let dragged = null, down = { x: 0, y: 0, t: 0 };

function setMouse(e) {
  const r = el.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  mouseClient.x = e.clientX; mouseClient.y = e.clientY;
}
function pickStar(e) {
  const r = el.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const k = (r.height / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const minPx = e.pointerType === 'touch' ? 28 : 16;
  let best = null, bestDist = Infinity;
  for (const s of stars) {
    tmpV.copy(s.group.position).project(camera);
    if (tmpV.z > 1) continue;
    const dist = camera.position.distanceTo(s.group.position);
    const pr = (s.radius / dist) * k;
    const d = Math.hypot((tmpV.x * 0.5 + 0.5) * r.width - px, (-tmpV.y * 0.5 + 0.5) * r.height - py);
    if (d < Math.max(minPx, pr * 1.2) && dist < bestDist) { best = s; bestDist = dist; }
  }
  return best;
}

el.addEventListener('pointerdown', e => {
  if (mode !== 'idle') return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const s = pickStar(e);
  if (!s) return;
  dragged = s;
  controls.enabled = false;
  el.setPointerCapture(e.pointerId);
  plane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()), s.group.position);
  setMouse(e);
  raycaster.setFromCamera(mouse, camera);
  raycaster.ray.intersectPlane(plane, hitP);
  dragOffset.copy(s.group.position).sub(hitP);
  dragPos.copy(s.group.position);
  down = { x: e.clientX, y: e.clientY, t: performance.now() };
  hideTip();
  e.stopPropagation();
}, true);

el.addEventListener('pointermove', e => {
  setMouse(e);
  if (mode !== 'idle') return;
  if (dragged) return;
  const s = e.pointerType === 'touch' ? null : pickStar(e);
  setHovered(s);
  el.style.cursor = s ? 'pointer' : 'grab';
  if (s) moveTip();
});
el.addEventListener('pointerleave', () => { if (!dragged) setHovered(null); });

function release(e) {
  if (!dragged) return;
  const s = dragged;
  dragged = null;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  const isClick = e.type === 'pointerup' && moved < 6 && performance.now() - down.t < 600;

  if (isClick) {
    startFocus(s);
    return;
  }
  let R = dragPos.length();
  if (R < MIN_R) { dragPos.setLength(MIN_R); R = MIN_R; }
  s.w = wOf(R);
  s.p0.copy(dragPos).applyAxisAngle(s.axis, -s.w * simT);
  controls.enabled = true;
}
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

// ---------- Loop ----------
function animate() {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastNow) / 1000);
  lastNow = now;

  timeScale += (timeScaleTarget - timeScale) * Math.min(1, dt * 3);
  if (Math.abs(timeScale - timeScaleTarget) < 0.001) timeScale = timeScaleTarget;
  simT += dt * timeScale;

  if (dragged) {
    raycaster.setFromCamera(mouse, camera);
    if (raycaster.ray.intersectPlane(plane, hitP)) dragPos.copy(hitP).add(dragOffset);
  }
  for (const s of stars) {
    if (s === dragged) s.group.position.copy(dragPos);
    else s.group.position.copy(s.p0).applyAxisAngle(s.axis, s.w * simT);
    const m = s.glow.material;
    m.opacity += (s.glowTarget - m.opacity) * Math.min(1, dt * 8);
  }
  if (hovered && !dragged) moveTip();

  if (!updateCameraAnim(now)) controls.update();
  composer.render();
  requestAnimationFrame(animate);
}
animate();
</script>
